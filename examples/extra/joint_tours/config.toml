main_directory = "output/"

custom_steps = ["custom_steps.py"]

crs = "epsg:2154"

osm_file = "data/auvergne-250101.osm.pbf"

simulation_ratio = 1.0

random_seed = 13081996

[simulation_area]
aav_name = "Clermont-Ferrand"

[zones]
france = true

[survey]
# nb_medoids = 3
od_method = "distance_matching"
max_od_distance_error = 200
nb_od_pair_draws = 100
[survey.nemobi]
path = "data/emc2-2023.zip"
# Only keep `face_to_face`-surveyed households (all persons are interviewed).
survey_method = "face_to_face"
# Discard households with at least one member < 5 y.o. (see `custom_steps.py`).
exclude_young_children = true

[osm_urban_areas]
urban_landuse_tags = [
    "commercial",
    "construction",
    "education",
    "industrial",
    "residential",
    "retail",
    "village_green",
    "recreation_ground",
    "garages",
    "religious",
]
buffer = 50

[osm_road_import]
highways = [
    "motorway",
    "motorway_link",
    "trunk",
    "trunk_link",
    "primary",
    "primary_link",
    "secondary",
    "secondary_link",
    "tertiary",
    "tertiary_link",
    "living_street",
    "unclassified",
    "residential",
]
simulation_area_filter = true
simulation_area_buffer = 8000
# If `true`, the edges are re-index after the postprocessing so that they are indexed from 1 to n.
reindex = false

[road_network]
# Minimum number of lanes allowed on edges.
min_lanes = 0.5
# Minimum speed limit allowed on edges (in km/h).
min_speed_limit = 10
# Minimum length allowed on edges (in meters).
min_length = 1
# Whether the duplicate edges (edges with same source and target) should be removed.
# Only the edge with the smallest free-flow travel time is kept.
remove_duplicates = false
# Whether the network should be restricted to the largest strongly connected component of the
# underlying graph.
# Warning. If `false`, some origin-destination pairs might not be feasible.
ensure_connected = true
# Edges' types that cannot be used as origin / destination nodes.
forbidden_types = ["motorway", "motorway_link", "trunk", "trunk_link"]
# Edges' types that are part of the "secondary" road network.
# By default, all edges are considered to be part of the "primary" road network.
secondary_types = [
    # "living_street",
    "unclassified",
    "residential",
]
# If true, add secondary edges to the primary road network to ensure that
# free-flow routes are primary-connected.
ensure_primary_connected = true
# penalty_coefficients_file = "data/edges_penalty_coefficients.csv"
min_effective_speed = 5.0
max_effective_speed = 135.0

# Default speed limit per roadtype, in km/h, in rural areas.
[road_network.default_speed_limit.rural]
motorway = 130
trunk = 110
primary = 80
secondary = 80
tertiary = 70
motorway_link = 70
trunk_link = 50
primary_link = 50
secondary_link = 50
tertiary_link = 50
living_street = 20
unclassified = 50
residential = 50
#road = 20
#service = 20

# Default speed limit per roadtype, in km/h, in urban areas.
[road_network.default_speed_limit.urban]
motorway = 130
trunk = 90
primary = 50
secondary = 50
tertiary = 30
motorway_link = 50
trunk_link = 50
primary_link = 50
secondary_link = 50
tertiary_link = 30
living_street = 20
unclassified = 30
residential = 30
#road = 20
#service = 20

# Default number of lanes per roadtype.
[road_network.default_lanes]
motorway = 3
trunk = 2
primary = 1
secondary = 1
tertiary = 1
motorway_link = 1
trunk_link = 1
primary_link = 1
secondary_link = 1
tertiary_link = 1
living_street = 1
unclassified = 1
residential = 1
#road = 1
#service = 1

[road_network.capacities]
motorway = 2000.0
trunk = 2000.0
motorway_link = 1500.0
trunk_link = 1500.0
primary = 1500.0
primary_link = 1500.0
secondary = 800.0
secondary_link = 800.0
tertiary = 600.0
tertiary_link = 600.0
unclassified = 600.0
residential = 600.0
living_street = 300.0
#road = 300
#service = 300
# motorway = 2000.0
# trunk = 2000.0
# primary = 1800.0
# secondary = 1500.0
# tertiary = 1200.0
# motorway_link = 1800.0
# trunk_link = 1800.0
# primary_link = 1800.0
# secondary_link = 1500.0
# tertiary_link = 1200.0
# living_street = 900.0
# unclassified = 1200.0
# residential = 1200.0
# #road = 300
# #service = 300

[road_network.capacity_multipliers]
traffic_signals = 0.5
roundabout = 0.75

[road_network.free_flow_calibration.variables]
[road_network.free_flow_calibration.variables.lanes]
type = "intervals"
cuts = [1, 2, 3]  # 1 lane, 2 lanes, 3 lanes, 3+ lanes

[road_network.free_flow_calibration.variables.speed_limit]
type = "intervals"
cuts = [30, 50, 70, 80, 90, 110]

[road_network.free_flow_calibration.variables.edge_type]
type = "categories"
[road_network.free_flow_calibration.variables.edge_type.map]
motorway = "motorway"
motorway_link = "motorway_link"
trunk = "trunk"
trunk_link = "trunk_link"
primary = "primary"
primary_link = "primary_link"
secondary = "secondary"
secondary_link = "secondary"
tertiary = "tertiary"
tertiary_link = "tertiary"
living_street = "living_street"
residential = "residential"
unclassified = "unclassified"
#service = "residential"
#road = "unclassified"

[osm_pedestrian_import]
highways = [
  "trunk",
  "trunk_link",
  "primary",
  "primary_link",
  "secondary",
  "secondary_link",
  "tertiary",
  "tertiary_link",
  "living_street",
  "unclassified",
  "residential",
  "road",
  "service",
  "track",
  "footway",
  "path",
  "pedestrian",
]
simulation_area_filter = true
simulation_area_buffer = 1000
# If `true`, the edges are re-index after the postprocessing so that they are indexed from 1 to n.
reindex = false

[pedestrian_network]
# Whether the duplicate edges (edges with same source and target) should be removed.
# Only the edge with the smallest distance is kept.
remove_duplicates = true
# Whether the network should be restricted to the largest strongly connected component of the
# underlying graph.
# Warning. If `false`, some origin-destination pairs might not be feasible.
ensure_connected = true
# Edges' types that cannot be used as origin / destination nodes.
forbidden_types = ["trunk", "trunk_link", "track"]

[pedestrian_routing]
output_path = true

[fuel]
consumption_factor = 0.08
price = 1.9
shared_with_passengers = true

[vehicle_types]
[vehicle_types.car]
headway = 8.0
ridesharing_passenger_count = 1.2

[synthetic_population]
eqasim_output = "data/output_eqasim/"
fraction = 1.0

[mode_choice]
modes = [
    "car_driver",
    "car_driver_with_passengers",
    "car_passenger",
    "public_transit",
    "walking",
    "bicycle"
]
model = "Logit"

[modes]
[modes.walking]
speed = 4.0
snap_speed = 4.0

[modes.walking.distance]
type = "pedestrian"
with_snap = true

[modes.bicycle]
speed = 12.0
snap_speed = 4.0

[modes.bicycle.distance]
type = "pedestrian"
with_snap = true

[gtfs]
files = [
    "data/gtfs/gtfs-puy-de-dome-20250901-20260831.zip",
    "data/gtfs/gtfs-t2c-20251006-20251220.zip",
]
date = 2025-12-09

[opentripplanner]
url = "http://0.0.0.0:8080/otp/gtfs/v1"
# batch_size = 50_000
time_type = "tstar"

[tomtom_requests]
date = 2027-03-15
departure_time = 03:00:00
nb_routes = 400
nb_waypoints = 148
nb_batches = 5
excluded_edge_types = ["motorway", "motorway_link", "trunk", "trunk_link", "primary", "primary_link"]
api_key = "env:TOMTOM_API_KEY"

[calibration]
[calibration.free_flow_travel_time]
additive_variables = ["traffic_signals"]
additive_interaction_variables = [["urban", "traffic_signals"]]
multiplicative_variables = ["edge_type", "speed_limit", "target_in_degree", "target_out_degree", "urban"]
multiplicative_interaction_variables = [
  [
    "edge_type",
    "speed_limit",
  ],
  [
    "urban",
    "speed_limit",
  ],
  [
    "speed_limit",
    "target_in_degree",
  ],
  [
    "speed_limit",
    "target_out_degree",
  ],
  [
    "target_in_degree",
    "target_out_degree",
  ],
]

[departure_time]
[departure_time.linear_schedule]
preferences_file = "data/linear_schedule_preferences.csv"
tstar_type = "arrival_time"

[departure_time_choice]
model = "ContinuousLogit"
mu = 1

[simulation]
period = ["03:00:00", "27:00:00"]
recording_interval = 900
learning_factor = 0.02
nb_iterations = 100
ex_ante_nb_iterations = 20
spillback = true
max_pending_duration = 60

[mode_classifier]
# external_model = "data/mode_estimator-france.joblib"
model = "logistic"
features = [
    # Tour-level variables.
    # "nb_trips",
    "first_activity_start",
    "last_activity_end",
    # "outside_perimeter",
    "total_activity_duration",
    "total_distance",
    "has_work_purpose",
    "has_education_purpose",
    "has_shopping_purpose",
    "has_task_purpose",
    "has_leisure_purpose",
    "has_escort_purpose",
    # "has_other_purpose",
    # "lowest_density",
    # "highest_density",
    "lowest_urban_type",
    "highest_urban_type",
    # "lowest_functional_area_type",
    # "highest_functional_area_type",
    # "lowest_functional_area_category",
    # "highest_functional_area_category",
    # Household-level variables.
    # "home_density",
    # "home_urban_type",
    # "home_functional_area_type",
    # "home_functional_area_category",
    # "nb_cars",
    "nb_bicycles",
    # "nb_persons",
    # "nb_majors",
    # "nb_minors",
    # "nb_women",
    # "nb_major_women",
    # "nb_men",
    # "nb_major_men",
    "nb_driving_licenses",
    # "household_type",
    # "minor_ratio",
    "car_ratio",
    "cars_per_license",
    # Person-level variables.
    "woman",
    "age",
    # "oldest_age_diff",
    # "education_level",
    # "professional_activity",
    # "socioprofessional_class",
    "has_driving_license",
    "has_public_transit_subscription",
    # "nb_tours",
]


[mode_choice_estimation]
variables = [
    "woman",
    "has_work_purpose",
    "has_education_purpose",
    "has_leisure_purpose",
    "has_shopping_purpose",
    "age_65_plus",
    "travel_time",
    "monetary_cost",
]
interaction_variables = []
reference_mode = "walking"
shared_car_driver_value_of_time = true
reference_value_of_time_mode = "car_driver"
reference_value_of_time = 12.0
# Exclude the joint tours done as solo car driver (same sample as `config-joint.toml`, without
# restricting the choice sets).
sample_filter = "NOT (COALESCE(joint_tour, FALSE) AND tour_mode = 'car_driver')"

[mode_choice_estimation.derived_variables]
age_65_plus = "age >= 65"

[mode_preferences]
from_econometrics = true

[mode_availability]
no_solo_modes_for_joint_tours = false

[mode_availability.car_driver]
requires_car = false
requires_driving_license = false
min_age = 18

[mode_availability.car_passenger]
requires_car = false

[mode_availability.walking]
max_distance = 4000

[mode_availability.bicycle]
max_distance = 20000

[plots]
width = "469.75pt"
latex = true
font = "serif"
fontsize = 10
format = "pdf"
colors = "Set2"
[plots.mode_colors]
car_driver = "#0072B2"
car_driver_with_passengers = "#CC79A7"
car_passenger = "#D55E00"
public_transit = "#E69F00"
walking = "#009E73"
bicycle = "#56B4E9"
