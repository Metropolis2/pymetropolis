main_directory = "output-joint"

parent_config = "config.toml"

[joint_travel]
features = [
    "nb_activities",
    "total_activity_duration",
    "total_distance",
    "first_activity_start",
    "last_activity_end",
    "age",
    "nb_persons",
    "nb_minors",
    "nb_cars",
    "nb_driving_licenses",
    "minor_ratio",
    "car_ratio",
    "cars_per_license",
    "woman",
    "has_driving_license",
    "has_leisure_purpose",
    "has_shopping_purpose",
    "has_task_purpose",
    "has_other_purpose",
    "has_work_purpose",
    "has_education_purpose",
    "has_escort_purpose",
    "professional_activity",
    "home_density",
    "home_urban_type",
    "home_functional_area_type",
]
feature_importance = true
nb_plotted_features = 8

[mode_choice_estimation]
variables = [
    "woman",
    "has_work_purpose",
    "has_education_purpose",
    "has_leisure_purpose",
    "has_shopping_purpose",
    "age_65_plus",
    "travel_time",
    "monetary_cost",
    "joint_tour",
]
interaction_variables = []

[mode_availability]
no_solo_modes_for_joint_tours = true
